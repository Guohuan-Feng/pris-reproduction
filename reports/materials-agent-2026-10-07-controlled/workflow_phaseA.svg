   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'" transform="translate(158.531713 209.294427)">组件归因：保持C015原程序</text>
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'" transform="translate(145.191634 226.862845)">基线B、趋势T、残差R、混合预测</text>
   </g>
   <g id="text_3">
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'" transform="translate(594.305475 209.229973)">结构对照：固定CatBoost和参数</text>
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'" transform="translate(619.751569 226.884329)">42维 → 66维 → 90维</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'" transform="translate(383.049531 327.167109)">本阶段完成：40次真实拟合</text>
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'" transform="translate(373 344.789668)">保存所有对照，独立复算与检查</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'" transform="translate(334.5 435.101645)">下一阶段：同一候选范围、同一数据与拟合预算</text>
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'" transform="translate(304.734688 452.096001)">真实Agent反馈循环 3×20轮  对照  普通TPE搜索 3×20候选</text>
   </g>
   <g id="text_6">
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'" transform="translate(271.088438 541.461178)">训练内选优并冻结程序 → 保存新2000材料的全部预测 → 才读取目标验证</text>
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'" transform="translate(280.660156 558.396236)">新确认和Agent对照均尚未完成，不把1.39%训练内增益当作测试结果</text>
